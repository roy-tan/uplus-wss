<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How Customer Engagement Studio works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { box-sizing:border-box; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
  --bg:#FFFFFF; --surface:#ECF0F9; --ink:#001F5F; --muted:#4A4F5A; --accent:#0E7E84; --accent-ink:#FFFFFF; --line:#D7E2F2; --track:#D7E2F2;
  --serif:'Lora', Georgia, 'Times New Roman', serif; --sansf:'Open Sans', 'Segoe UI', Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark;
  --bg:#0A1430; --surface:#13224A; --ink:#ECF0F9; --muted:#AEB8CE; --accent:#4FBFC4; --accent-ink:#04222A; --line:#24386A; --track:#24386A; } }
:root[data-theme="dark"] { color-scheme:dark; --bg:#0A1430; --surface:#13224A; --ink:#ECF0F9; --muted:#AEB8CE; --accent:#4FBFC4; --accent-ink:#04222A; --line:#24386A; --track:#24386A; }
html { scroll-padding-top:env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sansf); line-height:1.5; }
.wrap { max-width:1760px; margin:0 auto; padding:28px clamp(16px, 3vw, 40px) 48px; }
header.top { display:flex; align-items:baseline; justify-content:space-between; gap:24px; flex-wrap:wrap; margin:0 auto 16px; width:min(100%, calc((100svh - 190px) * 16 / 9)); min-width:min(100%, 640px); }
header.top h1 { font-family:var(--serif); font-weight:700; font-size:clamp(24px, 2.6vw, 34px); line-height:1.15; margin:0; }
header.top p { margin:0; color:var(--muted); font-size:16px; }
.hero { width:min(100%, calc((100svh - 190px) * 16 / 9)); min-width:min(100%, 640px); margin:0 auto; }
.screen { position:relative; width:100%; aspect-ratio:16 / 9; border-radius:16px; overflow:hidden; background:#ECF0F9; border:1px solid var(--line); }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden;
  --display:'Lora', Georgia, serif; --sans:'Open Sans', Arial, sans-serif; }
#stage .scene { position:absolute; inset:0; display:none; }
#stage .scene.on { display:block; }
.controls { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
.btn { font:inherit; font-size:15px; font-weight:600; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:9px 18px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.btn:hover { border-color:var(--accent); }
.btn:focus-visible, .seg:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.btn svg { width:16px; height:16px; flex:none; }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn[disabled] { opacity:.45; cursor:default; }
.time { margin-left:auto; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
.strip { display:flex; gap:4px; margin-top:14px; }
.seg { flex-grow:var(--d); flex-basis:0; min-width:0; height:34px; border:0; padding:0; background:none; cursor:pointer; position:relative; display:flex; flex-direction:column; justify-content:center; gap:5px; }
.seg .bar { display:block; height:6px; border-radius:3px; background:var(--track); overflow:hidden; }
.seg .fill { display:block; height:100%; width:0; background:var(--accent); }
.seg .n { font-size:12px; color:var(--muted); text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg.cur .n { color:var(--ink); font-weight:700; }
aside.panel { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px 30px; margin-top:22px; display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); gap:12px 40px; }
@media (max-width: 760px) { aside.panel { grid-template-columns:minmax(0, 1fr); } }
.panel .info { min-width:0; }
.panel .count { margin:0 0 6px; color:var(--accent); font-weight:700; font-size:14px; }
.panel h2 { font-family:var(--serif); font-size:28px; line-height:1.2; margin:0 0 14px; }
.panel .summary { margin:0; font-size:16px; line-height:1.6; }
.panel dl { margin:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px 24px; align-content:start; }
.panel dt { font-weight:700; font-size:15px; }
.panel dd { margin:2px 0 0; color:var(--muted); font-size:15px; }
.panel .hint { margin:20px 0 0; font-size:14px; color:var(--muted); min-height:1.5em; }
.panel .hint.ready { color:var(--ink); }
.chapters { margin:22px 0 0; padding:0; list-style:none; display:grid; gap:2px; }
.chapters button { font:inherit; font-size:14px; width:100%; text-align:left; background:none; border:0; border-radius:8px; padding:7px 10px; color:var(--muted); cursor:pointer; display:flex; gap:10px; }
.chapters button span:first-child { font-variant-numeric:tabular-nums; min-width:1.4em; }
.chapters button:hover { background:color-mix(in srgb, var(--accent) 10%, transparent); }
.chapters button[aria-current="true"] { color:var(--ink); font-weight:700; background:color-mix(in srgb, var(--accent) 14%, transparent); }
.chapters button:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }
.chapters[hidden] { display:none; }
.keys { margin-top:12px; font-size:13px; color:var(--muted); }
#stage { --ground:#ECF0F9; --main:#0E7E84; --second:#001F5F; --accent:#5F67B9; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:72px; line-height:1.08; font-weight:700 } .sub { font-size:34px; line-height:1.3; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }
.tag { font-size:24px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--main) }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.ink { fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round; stroke-linejoin:round }
.ly-bld { position:absolute; left:960px; top:120px; width:820px; height:800px }
.ly-room { position:absolute; left:0; width:820px; box-sizing:border-box; border-radius:16px; border:3px solid var(--second); overflow:hidden }
.ly-ces { top:40px; height:260px; background:var(--second); color:var(--ground) }
.ly-ops { top:320px; height:200px; background:color-mix(in srgb, var(--main) 16%, var(--ground)); border-color:var(--main); color:var(--second) }
.ly-cdh { top:540px; height:240px; background:color-mix(in srgb, var(--accent) 12%, var(--ground)); border-color:var(--accent); color:var(--second) }
.ly-roof { position:absolute; left:-20px; top:0; width:860px; height:22px; border-radius:8px; background:var(--second) }
.ly-floor { position:absolute; left:-60px; top:790px; width:940px; height:4px; border-radius:2px; background:color-mix(in srgb, var(--second) 40%, var(--ground)) }
.ly-label { position:absolute; left:28px; top:20px; display:flex; flex-direction:column; gap:4px; margin:0 } .ly-label > * { margin:0 }
.ly-kicker { font-size:22px; font-weight:700; letter-spacing:.14em; text-transform:uppercase }
.ly-ces .ly-kicker { color:color-mix(in srgb, var(--main) 55%, var(--ground)) } .ly-ops .ly-kicker { color:var(--main) } .ly-cdh .ly-kicker { color:var(--accent) }
.ly-name { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:34px; line-height:1.15; font-weight:700 }
.card { position:absolute; box-sizing:border-box; width:120px; height:150px; border-radius:10px; background:color-mix(in srgb, var(--ground) 40%, #FFFFFF); border:3px solid var(--second); box-shadow:0 10px 20px rgba(0,0,0,.18) }
.card i { display:block; height:8px; margin:16px 14px 0; border-radius:4px; background:color-mix(in srgb, var(--second) 30%, var(--ground)) }
.pill { position:absolute; margin:0; padding:12px 26px; border-radius:999px; font-size:28px; font-weight:700; white-space:nowrap; background:color-mix(in srgb, var(--ground) 40%, #FFFFFF); border:3px solid var(--main); color:var(--second) }
.tile { position:absolute; box-sizing:border-box; border-radius:18px; background:color-mix(in srgb, var(--second) 82%, var(--ground)); border:2px solid color-mix(in srgb, var(--ground) 22%, var(--second)); display:flex; flex-direction:column; gap:10px; color:var(--ground) }
.tile h3 { margin:0; font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:38px; line-height:1.1; font-weight:700 }
.tile p { margin:0; font-size:27px; line-height:1.3; color:color-mix(in srgb, var(--ground) 78%, var(--second)) }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>How Customer Engagement Studio works</h1>
    <p>Eleven short chapters. Pause, go back or replay anything.</p>
  </header>
  <div class="hero">
    <section aria-label="Animation">
      <div class="screen" id="screen"><div id="stage"></div></div>
      <div class="controls">
        <button class="btn" id="prev" aria-label="Previous chapter"><svg viewBox="0 0 16 16"><path d="M11 2 L4 8 L11 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Previous</button>
        <button class="btn" id="replay"><svg viewBox="0 0 16 16"><path d="M3 8 A5 5 0 1 0 5 4 M5 1 V4 H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Replay chapter</button>
        <button class="btn" id="play"><svg viewBox="0 0 16 16" id="playIcon"></svg><span id="playLabel">Pause</span></button>
        <button class="btn" id="next">Next chapter<svg viewBox="0 0 16 16"><path d="M5 2 L12 8 L5 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="time" id="time">0:00 / 1:14</span>
      </div>
      <div class="strip" id="strip" role="group" aria-label="Chapters timeline"></div>
      <p class="keys">Keyboard: Space plays or pauses, ← and → move between chapters, R replays the chapter.</p>
    </section>
    <aside class="panel" aria-live="polite">
      <div class="info">
        <p class="count" id="count">Chapter 1 of 8</p>
        <h2 id="ctitle"></h2>
        <p class="summary" id="csum"></p>
        <p class="hint" id="hint"></p>
      </div>
      <dl id="cpoints"></dl>
      <ol class="chapters" id="clist" hidden></ol>
    </aside>
  </div>
</div>
<script>
const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = (p) => 1 - Math.pow(1 - p, 3);
const eio = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eob = (p, s) => { s = s == null ? 1.70158 : s; const c3 = s + 1; return 1 + c3 * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
const TextFx = {
  fadeFromRight(el, t, start, opts) {
    if (!el._w) {
      const words = el.textContent.trim().split(/\s+/);
      el.textContent = '';
      el._w = words.map((w, i) => {
        const s = document.createElement('span');
        s.textContent = w; s.style.display = 'inline-block';
        el.appendChild(s);
        if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
        return s;
      });
    }
    const st = (opts && opts.stagger != null) ? opts.stagger : 0.06;
    el._w.forEach((s, i) => {
      const p = eo(seg(t, start + i * st, start + i * st + 0.6));
      s.style.opacity = p;
      s.style.transform = 'translateX(' + ((1 - p) * 40) + 'px)';
    });
  },
};
const STAGE = document.getElementById('stage');
const REG = {}, BOX = {};
function mkKit(id) {
  const box = document.createElement('div');
  box.className = 'scene';
  STAGE.appendChild(box);
  BOX[id] = box;
  return { seg, lerp, eo, eio, eob, TextFx, stage: box,
    h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; },
    scene(name, obj) { REG[name] = obj; } };
}
window.LY = {
  ROAD: 900, DECK: 744, PSC: 0.45,
  building() {
    return '<div class="ly-bld"><div class="ly-roof"></div>' +
      '<div class="ly-room ly-ces"><div class="ly-label"><p class="ly-kicker">Where you ask</p><p class="ly-name">Customer Engagement Studio</p></div>' +
      '<svg class="art" viewBox="0 0 820 260"><g class="ink"><path d="M380 130 Q380 112 398 112 H520 Q538 112 538 130 V176 Q538 194 520 194 H430 L404 214 V194 H398 Q380 194 380 176 Z"/><path d="M410 145 H508 M410 165 H476"/><circle cx="612" cy="160" r="24"/><circle cx="690" cy="160" r="24"/><circle cx="768" cy="160" r="24"/><path d="M538 160 H588 M636 160 H666 M714 160 H744"/></g></svg></div>' +
      '<div class="ly-room ly-ops"><div class="ly-label"><p class="ly-kicker">Where changes are governed</p><p class="ly-name">1:1 Operations Manager</p></div>' +
      '<svg class="art" viewBox="0 0 820 200"><g class="ink"><rect x="600" y="70" width="180" height="110" rx="10"/><path d="M620 98 L630 108 L646 90 M662 99 H760 M620 128 L630 138 L646 120 M662 129 H760 M622 156 H646 M662 159 H730"/></g></svg></div>' +
      '<div class="ly-room ly-cdh"><div class="ly-label"><p class="ly-kicker">Where decisions run</p><p class="ly-name">Customer Decision Hub</p></div>' +
      '<svg class="art" viewBox="0 0 820 240"><g class="ink"><circle cx="520" cy="150" r="46"/><circle cx="670" cy="150" r="46"/><path d="M566 150 H624"/></g><g class="ink"><path class="ly-spoke1" d="M520 112 V188 M482 150 H558"/><path class="ly-spoke2" d="M670 112 V188 M632 150 H708"/></g></svg></div>' +
      '<div class="ly-floor"></div></div>';
  },
  spin(stage, t) {
    const a = (t * 90) % 360;
    const s1 = stage.querySelector('.ly-spoke1'), s2 = stage.querySelector('.ly-spoke2');
    if (s1) s1.setAttribute('transform', 'rotate(' + a + ' 520 150)');
    if (s2) s2.setAttribute('transform', 'rotate(' + -a + ' 670 150)');
  },
  ok() {
    return '<div class="ly-ok" style="position:absolute;right:-22px;top:-22px;width:52px;height:52px;border-radius:26px;background:var(--main)"><svg viewBox="0 0 52 52" style="position:absolute;inset:0"><path d="M15 27 L23 35 L38 18" style="fill:none;stroke:var(--ground);stroke-width:6;stroke-linecap:round;stroke-linejoin:round"/></svg></div>';
  },
  paper(i, cls, mine) {
    const w = mine ? 86 : 40 + ((i * 17) % 40);
    return '<div class="card ' + cls + '" style="left:0;top:0;transform-origin:center' + (mine ? ';border-color:var(--main);box-shadow:0 0 0 6px color-mix(in srgb, var(--main) 35%, transparent), 0 10px 20px rgba(0,0,0,.18)' : '') + '"><i></i><i style="width:' + w + 'px"></i><i></i><i style="width:' + (mine ? 50 : w - 20) + 'px"></i>' + window.LY.ok() + '</div>';
  },
  vehicle(label, cls) {
    const wheel = (x) => '<div style="position:absolute;left:' + x + 'px;top:84px;width:46px;height:46px;box-sizing:border-box;border-radius:23px;background:var(--second);border:6px solid color-mix(in srgb, var(--ground) 55%, var(--second))"></div>';
    return '<div class="' + cls + '" style="position:absolute;left:0;top:0;width:300px;height:130px"><div style="position:absolute;left:0;top:0;width:300px;height:100px;box-sizing:border-box;border-radius:18px;background:var(--second);border:3px solid color-mix(in srgb, var(--ground) 55%, var(--second));display:flex;align-items:center;justify-content:center"><p style="margin:0;font-size:28px;font-weight:700;color:var(--ground)">' + label + '</p></div>' + wheel(44) + wheel(210) + '</div>';
  },
};
(function(kit){
const { seg, eo, eob, lerp, TextFx } = kit;
kit.scene('layers', {
  init(kit) {
    this.root = kit.h('<div class="ground"><div class="layers-cam" style="position:absolute;inset:0;transform-origin:1370px 520px">' + window.LY.building() + '</div>' +
      '<div class="words" style="left:120px;top:270px;width:760px"><p class="tag layers-tag">The architecture</p>' +
      '<h1 class="line layers-line">How Customer Engagement Studio works</h1>' +
      '<p class="sub layers-sub">Three layers, each with one job.</p></div></div>');
    kit.stage.append(this.root);
    const q = (s) => this.root.querySelector(s);
    this.cam = q('.layers-cam').style;
    this.tag = q('.layers-tag').style;
    this.sub = q('.layers-sub').style;
    this.line = q('.layers-line');
    this.parts = [['.ly-roof', -0.5], ['.ly-ces', -0.5], ['.ly-ops', 1.1], ['.ly-cdh', 2.4], ['.ly-floor', 2.4]].map(([s, t0]) => ({ st: q(s).style, t0 }));
  },
  render(t) {
    this.cam.transform = 'scale(' + lerp(1, 1.04, seg(t, 0, 7)) + ')';
    this.tag.opacity = eo(seg(t, -0.7, -0.2));
    TextFx.fadeFromRight(this.line, t, -0.7, { stagger: 0.09 });
    const s = eo(seg(t, 3.6, 4.2));
    this.sub.opacity = s;
    this.sub.transform = 'translateX(' + lerp(26, 0, s) + 'px)';
    for (const p of this.parts) {
      p.st.opacity = eo(seg(t, p.t0, p.t0 + 0.3));
      p.st.transform = 'translateY(' + lerp(60, 0, eob(seg(t, p.t0, p.t0 + 0.8), 1.6)) + 'px)';
    }
    window.LY.spin(this.root, t);
  },
});
})(mkKit('layers'));
(function(kit){
const { seg, eo, eio, eob, lerp, TextFx } = kit;
const AG = [
  ['Marketing Briefs', 'Turns a brief into intent', '<path d="M14 50 L18 36 L44 10 L54 20 L28 46 Z M38 16 L48 26"/>'],
  ['Engagement Policy', 'Plain English into policies', '<path d="M32 10 V54 M18 54 H46 M12 22 H52 M12 22 L4 38 H20 Z M52 22 L44 38 H60 Z"/>'],
  ['Creative', 'Designs the treatments', '<path d="M32 8 A16 16 0 0 1 42 36 V44 H22 V36 A16 16 0 0 1 32 8 Z M24 52 H40"/>'],
];
kit.scene('agents', {
  init(kit) {
    let cards = '';
    AG.forEach(([n, d, ic], i) => {
      cards += '<div class="tile agents-card" style="left:' + (120 + i * 572) + 'px;top:560px;width:536px;padding:40px">' +
        '<svg viewBox="0 0 64 64" style="width:64px;height:64px;color:color-mix(in srgb, var(--main) 55%, var(--ground))"><g class="ink">' + ic + '</g></svg>' +
        '<h3>' + n + '</h3><p>' + d + '</p></div>';
    });
    this.root = kit.h('<div class="ground"><div class="agents-cam" style="position:absolute;inset:0;transform-origin:0 0">' + window.LY.building() + '</div>' +
      '<div class="agents-in" style="position:absolute;inset:0;background:var(--second);color:var(--ground)">' +
      '<div class="words" style="left:120px;top:150px;width:1500px"><p class="tag agents-tag" style="color:color-mix(in srgb, var(--main) 55%, var(--ground))">Inside Customer Engagement Studio</p>' +
      '<h2 class="line agents-line">Helping agents</h2>' +
      '<p class="sub agents-sub" style="color:color-mix(in srgb, var(--ground) 75%, var(--second))">You describe what you want. Each agent drafts its part.</p></div>' + cards + '</div></div>');
    kit.stage.append(this.root);
    const q = (s) => this.root.querySelector(s);
    this.cam = q('.agents-cam').style;
    this.inside = q('.agents-in').style;
    this.tag = q('.agents-tag').style;
    this.sub = q('.agents-sub').style;
    this.line = q('.agents-line');
    this.cards = [...this.root.querySelectorAll('.agents-card')].map((e) => e.style);
  },
  render(t) {
    const p = eio(seg(t, 0.2, 1.8));
    const z = Math.exp(lerp(Math.log(1.04), Math.log(2.4), p));
    this.cam.transform = 'translate(' + lerp(1370 * -0.04, 960 - 1370 * 2.4, p) + 'px,' + lerp(520 * -0.04, 540 - 290 * 2.4, p) + 'px) scale(' + z + ')';
    const f = eo(seg(t, 1.5, 2.0));
    this.inside.opacity = f;
    this.inside.transform = 'scale(' + lerp(1.06, 1, f) * lerp(1, 1.015, seg(t, 2.0, 7)) + ')';
    this.tag.opacity = eo(seg(t, 2.0, 2.4));
    TextFx.fadeFromRight(this.line, t, 2.1);
    const s = eo(seg(t, 2.9, 3.4));
    this.sub.opacity = s;
    this.sub.transform = 'translateX(' + lerp(26, 0, s) + 'px)';
    this.cards.forEach((st, i) => {
      const t0 = 3.6 + i * 0.6;
      st.opacity = eo(seg(t, t0, t0 + 0.3));
      st.transform = 'translateY(' + lerp(50, 0, eob(seg(t, t0, t0 + 0.75), 1.6)) + 'px)';
    });
  },
});
})(mkKit('agents'));
(function(kit){
const { seg, eo, eio, eob, lerp, TextFx } = kit;
const TO = [
  ['Application Exploration', 'Reads how the app is set up'],
  ['Runtime Analytics', 'History and action performance'],
  ['Guidebooks', 'Best practices and how-tos'],
  ['Advisories', 'Health gaps found for you'],
];
const ND = [[1470, 470], [1810, 470], [1640, 380]];
const HB = [1640, 640];
kit.scene('tools', {
  init(kit) {
